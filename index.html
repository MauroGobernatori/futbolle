<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbolle</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="contenedor">

        <header class="encabezado">
            <h1>Futbolle</h1>
            <p class="nombre_jugador">Jugador: <span id="nombre_usuario"></span></p>
        </header>

        <section class="seccion_busqueda">
            <input type="text" id="input_busqueda" placeholder="Buscar jugador...">
            <ul id="lista_autocompletado" class="autocompletado"></ul>
        </section>

        <section class="info_juego">
            <p>Intentos restantes: <span id="intentos">8</span></p>
            <p>Tiempo: <span id="tiempo">0s</span></p>
        </section>

        <section id="tablero" class="tablero">
            
        </section>

        <button id="boton_reiniciar" class="boton_reiniciar">Reiniciar</button>

    </main>
</body>
</html>
