<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbolle</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main class="contenedor">

        <header class="encabezado">
            <h1>Futbolle</h1>
        </header>

        <div id="pantalla_inicio" class="pantalla_inicio contenedor">
            <h2>Bienvenido</h2>

            <input type="text" id="input_nombre" placeholder="Tu nombre">

            <select id="select_dificultad">
                <option value="">Seleccionar dificultad</option>
                <option value="facil" disabled>Fácil</option>
                <option value="media" disabled>Media</option>
                <option value="dificil">Difícil</option>
            </select>

            <button id="btn_iniciar_juego">Jugar</button>
        </div>

        <div id="pantalla_juego" class="pantalla_juego oculto">
            <section class="seccion_busqueda">
                <input type="text" id="input_busqueda" placeholder="Buscar jugador..." disabled>
                <ul id="lista_autocompletado" class="autocompletado"></ul>
            </section>

            <section class="nombre_repetido oculto" id="nombre_repetido">
                <p>Ese nombre ya fue usado</p>
            </section>

            <section class="info_juego">
                <p>Intentos restantes: <span id="intentos"></span></p>
                <p><span id="tiempo">Tiempo: 0s</span></p>
            </section>

            <section>
                <table id="tablero" class="tablero">

                </table>
            </section>

            <button id="boton_reiniciar" class="boton_reiniciar">Reiniciar</button>
        </div>

        
        <a href="contacto.html" class="boton_link">
        Ir a Contacto
        </a>

        <button id="boton_modo">🌙</button>

        <button onclick="abrirHistorial()" class="boton_historial">Ver Historial</button>

    </main>

    <div id="modal_perdiste" class="modal_oculto">
        <div class="modal_contenido">
            <h2>¡Perdiste!</h2>
            
            <p class="texto_modal">El jugador secreto era:</p>

            <div id="jugador_secreto" class="datos_jugador">
                
            </div>

            <button id="btn_cerrar_modal_derrota">Cerrar</button>
        </div>
    </div>

    <div id="modal_victoria" class="modal_oculto">
        <div class="modal_contenido">
            <h2 class="titulo_victoria">¡Ganaste!</h2>
            
            <p class="texto_victoria">
            Descubriste el jugador correctamente
            </p>

            <div class="info_victoria">
            <p><strong>Tiempo:</strong> <span id="tiempo_final"></span></p>
            <p><strong>Intentos usados:</strong> <span id="intentos_usados"></span></p>
            </div>

            <button id="btn_cerrar_modal_victoria">Cerrar</button>
        </div>
    </div>

    <div id="modal_historial" class="modal_oculto">
        <div class="modal_contenido">
            <h2>Historial de partidas</h2>

            <div class="controles_historial">
            <button id="btn_ordenar_fecha" class="boton_modal_historial">Ordenar por fecha</button>
            <button id="btn_ordenar_intentos" class="boton_modal_historial">Ordenar por intentos</button>
            </div>

            <div id="lista_historial"></div>

            <button id="btn_cerrar_modal_historial" class="boton_modal_historial">Cerrar</button>
        </div>
    </div>

    <script src="./js/index.js"></script>
</body>
</html>
