<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>

  <link rel="stylesheet" href="./css/contacto.css">
</head>
<body>

  <main class="contenedor-contacto">
    <section class="card-contacto">

      <h1>Contacto</h1>
      <p class="descripcion">
        Si tenés alguna consulta o sugerencia, completá el formulario.
      </p>

      <form class="formulario-contacto" action="mailto:ejemplo@example.com" method="post" enctype="text/plain" id="form-contacto">
        <div class="grupo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required>
        </div>

        <div class="grupo">
          <label for="text">Email</label>
          <input type="text" id="email" required>
        </div>

        <div class="grupo">
          <label for="asunto">Asunto</label>
          <input type="text" id="asunto" required>
        </div>

        <div class="grupo">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" rows="5" required></textarea>
        </div>

        <button type="submit" class="boton-enviar">
          Enviar mensaje
        </button>
        <a href="index.html" class="boton-link volver">
            Volver al Inicio
        </a>

      </form>

    </section>
  </main>

    <div id="modal" class="modal">
        <div class="modal-contenido">
            <p id="modal-mensaje"></p>
            <button onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

  <script src="./js/contacto.js"></script>

</body>
</html>
